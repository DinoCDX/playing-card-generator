<html>
<head>
    <style>
        body {
            background-color: #111214;
            display: flex;
            gap: 1in;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            position: relative;
            overflow: hidden;
            width: 2.5in;
            height: 3.5in;
            border-radius: 5mm;
            box-shadow: 0 0.06in 0.12in rgba(0,0,0,0.35);
            font-family: Georgia, 'Times New Roman', serif;
        }
        /* ---- front face (9 of diamonds) ---- */
        #front { background: #ffffff; }
        #front .watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6in;
            opacity: 0.09;
            color: #e0263f;
        }
        #front .corner {
            position: absolute;
            font-size: 0.55in;
            line-height: 1;
            color: #e0263f;
        }
        #front .corner.top { top: 0.14in; left: 0.16in; }
        #front .corner.bottom { bottom: 0.14in; right: 0.16in; transform: rotate(180deg); }
        #front .rank {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.3in;
            color: #e0263f;
            text-shadow: 0 0.02in 0 rgba(0,0,0,0.15);
        }
        /* ---- back face ---- */
        #back {
            background: #7a1128;
        }
        #back .frame-outer {
            position: absolute;
            inset: 0.12in;
            border: 0.045in solid #e9d9b8;
            border-radius: 3mm;
        }
        #back .frame-inner {
            position: absolute;
            inset: 0.2in;
            border: 0.02in solid #e9d9b8;
            border-radius: 2mm;
            background-color: #7a1128;
            background-image:
                repeating-linear-gradient(45deg, #e9d9b822 0, #e9d9b822 0.045in, transparent 0.045in, transparent 0.14in),
                repeating-linear-gradient(-45deg, #e9d9b822 0, #e9d9b822 0.045in, transparent 0.045in, transparent 0.14in);
        }
        #back .medallion {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1.5in;
            height: 1.5in;
            border-radius: 50%;
            border: 0.035in solid #e9d9b8;
            background: repeating-radial-gradient(
                circle,
                #e9d9b8e6 0,
                #e9d9b8e6 0.018in,
                transparent 0.018in,
                transparent 0.11in
            );
        }
    </style>
</head>
<body>
    <div id="front" class="card">
        <div class="watermark">♦️</div>
        <div class="corner top">♦️</div>
        <div class="rank">9</div>
        <div class="corner bottom">♦️</div>
    </div>
    <div id="back" class="card">
        <div class="frame-outer"></div>
        <div class="frame-inner"></div>
        <div class="medallion"></div>
    </div>
</body>
</html>
