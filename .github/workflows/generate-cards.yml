name: Generate & release cards

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install fonts (needed for the ♥ ♣ ♦ ♠ suit symbols) and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-color-emoji fonts-noto-extra ffmpeg

      - name: Install dependencies
        working-directory: playingcards
        run: npm install

      - name: Generate static card PNGs (52 fronts + card_back.png)
        working-directory: playingcards
        run: npm run generate:cards

      - name: Generate animated flip GIFs (52 cards)
        working-directory: playingcards
        run: npm run generate:gifs

      - name: Zip everything for release
        working-directory: playingcards
        run: |
          mkdir -p ../dist
          zip -r "../dist/playing-cards-${{ github.run_number }}.zip" cards gifs

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "cards-${{ github.run_number }}" \
            "dist/playing-cards-${{ github.run_number }}.zip" \
            --title "Playing cards build #${{ github.run_number }}" \
            --notes "Auto-generated by CI from commit ${{ github.sha }}.

          Contains:
          - \`cards/\` — 52 static front PNGs + \`card_back.png\`
          - \`gifs/\` — 52 animated flip GIFs (back → face); loop behaviour is set by \`GIF_LOOP_REPEAT\` in \`generate-flip-gifs.js\`"