name: Generate & Release Discord Emojis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Puppeteer (Node.js)
        run: npm install puppeteer

      - name: Install Pillow (Python)
        run: pip install pillow

      - name: Generate Static Frames and Card Back
        run: node playingcards/index.js

      - name: Stitch Animated Flips
        run: python playingcards/stitch.py

      - name: Zip Emoji Assets
        # This explicitly zips only the two target folders inside the cards directory
        run: zip -r discord-blackjack-emojis.zip cards/animated cards/static

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Blackjack Emojis Update (Build ${{ github.run_number }})
          body: "Automated build containing all rectangular static and single-play animated card flips."
          files: discord-blackjack-emojis.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}